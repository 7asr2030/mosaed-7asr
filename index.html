<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مساعد الحصر - نظام التعرف على الوجه</title>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ملف التنسيق -->
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبات خارجية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="glass-container">
        
        <!-- الهيدر -->
        <header>
            <div class="logo">🎯 مساعد الحصر</div>
            <div class="subtitle">نظام التقاط البصمات الموزع</div>
        </header>

        <!-- المرحلة الأولى: رفع ملف الإكسل -->
        <div id="step-upload" class="step active">
            <h2>1. استيراد بيانات الطلاب</h2>
            <p>قم باختيار ملف الإكسل الخاص بطلاب مدرستك</p>
            
            <div class="file-upload-wrapper">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls">
                <div class="upload-btn">
                    <span class="icon">📁</span>
                    <span>اختر ملف Excel</span>
                </div>
            </div>
            <div id="uploadStatus" class="status-msg"></div>
        </div>

        <!-- المرحلة الثانية: اختيار الطالب وبدء التصوير -->
        <div id="step-students" class="step">
            <h2>2. اختيار الطالب</h2>
            <div class="students-stats">
                <span>تم التعرّف على: <b id="studentsCount">0</b> طالب</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث باسم الطالب أو رقمه...">
            </div>

            <div class="students-list" id="studentsList">
                <!-- سيتم ملء هذه القائمة بواسطة الجافاسكربت -->
            </div>

            <button id="downloadZipBtn" class="primary-btn pulse-btn" style="display: none;">
                ⬇️ تنزيل جميع الصور كملف (ZIP)
            </button>
        </div>

        <!-- المرحلة الثالثة: كاميرا التصوير بـ 5 زوايا -->
        <div id="step-camera" class="step">
            <button id="backToListBtn" class="secondary-btn">🔙 عودة للقائمة</button>
            <h3 id="currentStudentName" class="student-name-display">اسم الطالب</h3>
            
            <div class="camera-container">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvasElement"></canvas>
                
                <!-- إطار توجيه الوجه -->
                <div id="faceGuide" class="face-guide">
                    <div class="guide-circle"></div>
                    <div id="instructionText" class="instruction-text">يرجى توجيه وجه الطالب داخل الدائرة</div>
                </div>
                
                <div class="progress-bar-container">
                    <div id="captureProgress" class="progress-bar"></div>
                </div>
            </div>
            
            <div class="poses-status" id="posesStatus">
                <div class="pose-badge pending" id="pose-center">الأمام</div>
                <div class="pose-badge pending" id="pose-right">يمين</div>
                <div class="pose-badge pending" id="pose-left">يسار</div>
                <div class="pose-badge pending" id="pose-up">أعلى</div>
                <div class="pose-badge pending" id="pose-down">أسفل</div>
            </div>
        </div>

    </div>

    <!-- ملف المنطق البرمجي -->
    <script src="app.js"></script>
</body>
</html>
